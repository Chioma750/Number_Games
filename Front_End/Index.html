<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>minigame</title>
    <style>
        body {
            font-family: 'JetBrains Mono',  monospace;
            background-color: #16171a;
            color: #edebe6;
            display: flex; 
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            gap: 20px;
        }
        #guessGame {
            background-color: #1f2023;
            width: 420px;
            padding: 20px;
            border-radius: 16px; 
        }
        button {
            border: none;
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 17px;
            padding: 16px 0;
            cursor: pointer;
            color: #edebe6;           
        }
        .level {
            background-color: #6b5228;
            color: #e9a23b;   
        }
        #submit {
            background-color: #e9a23b;
            color: #1a1206;
        }
        #guess {
            display: flex;
            gap: 20px;
        }
        #GameLevels {
            display: flex;
            gap: 20px;
        }
        #guess input {
            background: #26282c;
            border: none;
            padding: 16px 0;
            font-family: 'JetBrains Mono', monospace;
            flex: 1;
            color: #edebe6;
            border-radius: 10px;
        }
        #feedback {
            text-align: center;
            font-size: 17px;
            white-space: pre-line;
        }
        #status {
            color: #8b8f94;
            font-size: 13px;
            margin: 0;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <div id = "header">
        <h2>Number Game</h2>
        <p class = "kicker"> Web Build </p>
    </div>

    <div id = "guessGame">
        <div id="GameLevels">
            <button class="level">Easy</button>
            <button class="level">Medium</button>
            <button class="level">Hard</button>
        </div>

        <div id="guess">
            <input id = "guessInput" type="number" placeholder="Enter a guess">
            <button id="submit">Submit</button>
        </div>

        <div id="feedback"></div>

        <div> 
            <button id="playAgain"> Play Again </button>
        </div>

        <div id="status">
            <p id="Trials">Attempt</p>
            <p id="currentRange">Range</p>
        </div>
        
    </div>

    <script>
        let secret_Number = null
        let attempt = 0
        const maxAttempt = 5
        let lowerBound = null
        let upperBound = null 

        const guessInput = document.getElementById("guessInput");
        console.log(guessInput)

        const feedback = document.getElementById("feedback");
        console.log(feedback)

        const Trials = document.getElementById("Trials");
        console.log(Trials)

        const currentRange = document.getElementById("currentRange");
        console.log(currentRange)

        function resetGame() {
            secret_Number = null
            attempt = 0
            lowerBound = null
            upperBound = null
            feedback.textContent = ""
            Trials.textContent = `Attempts: ${attempt} / ${maxAttempt}`
            currentRange.textContent = "Choose your Level."
            guessInput.value = ""
            playAgain = ""
        }
        resetGame.addEventListener("click", function() {})

        const submit = document.getElementById("submit");
        submit.addEventListener("click", function() {
            const guess = parseInt(guessInput.value);
            if (isNaN(guess)) {
                feedback.textContent = "Invalid input, please enter a valid number"
                return
            }

            attempt += 1
            Trials.textContent = `Attempts: ${attempt} / ${maxAttempt}`

            if (guess === secret_Number) {
                feedback.textContent = "You are correct ✅"
            } else if (attempt === maxAttempt) {
                feedback.textContent = `You Failed 🤣, and you have reached your limit! \n The answer is: ${secret_Number}`
            } else if (guess > secret_Number) {
                feedback.textContent = "Too high"
            } else if (guess < secret_Number) {
                feedback.textContent = "Too low"
            }
        })
        console.log(submit)

        const level = document.querySelectorAll(".level");
        level.forEach(function(button) {
            button.addEventListener("click", function(event) {
                if (event.target.textContent.toLowerCase() === "easy") {
                    lowerBound = 1;
                    upperBound = 100;
                } else if (event.target.textContent.toLowerCase() === "medium") {
                    lowerBound = 1;
                    upperBound = 500;
                } else if (event.target.textContent.toLowerCase() === "hard") {
                    lowerBound = 1;
                    upperBound = 1000;
                } 
                secret_Number = Math.floor(Math.random() * (upperBound - lowerBound + 1)) + lowerBound
                currentRange.textContent = `Range: ${lowerBound} to ${upperBound}`
                console.log(secret_Number)
                console.log(lowerBound, upperBound)
            })
        })
        
    </script>
    
</body>
</html>
